services:
  postgres:
    image: postgres:16
    container_name: datalaburo-postgres
    environment:
      POSTGRES_DB: datalaburo
      POSTGRES_USER: datalaburo
      POSTGRES_PASSWORD: datalaburo
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - datalaburo-postgres-data:/var/lib/postgresql/data

volumes:
  datalaburo-postgres-data:
