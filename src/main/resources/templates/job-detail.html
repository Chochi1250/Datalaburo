<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<title>DataLaburo - Detalle de oferta</title>
	<link rel="stylesheet" th:href="@{/app.css}"/>
</head>
<body class="page page-jobs page-job-detail">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container jobs-page">
	<section class="jobs-shell job-detail-standalone">
		<article class="job-detail is-active">
			<div class="detail-top">
				<div class="detail-title-row">
					<div class="company-mark company-mark-lg" th:attr="data-company=${job.company}">
						<img class="logo-img"
							 th:if="${job.companyLogoUrl != null && !job.companyLogoUrl.isBlank()}"
							 th:src="${job.companyLogoUrl}"
							 alt=""
							 loading="lazy"
							 decoding="async"
							 referrerpolicy="no-referrer"
							 onload="this.parentElement.querySelector('.logo-fallback').style.display='none';"
							 onerror="this.style.display='none'; this.parentElement.querySelector('.logo-fallback').style.display='grid';" />
						<span class="logo-fallback"
							  th:style="${job.companyLogoUrl != null && !job.companyLogoUrl.isBlank()} ? 'display:none' : ''"
							  th:text="${job.company != null && !job.company.isBlank() ? #strings.substring(job.company,0,1) : (job.title != null && !job.title.isBlank() ? #strings.substring(job.title,0,1) : '?')}"></span>
					</div>
					<div class="detail-heading">
						<h1 class="detail-title" th:text="${job.title != null ? job.title : 'Oferta sin titulo'}"></h1>
						<div class="detail-company" th:text="${job.company != null && !job.company.isBlank() ? job.company : 'Empresa no informada'}"></div>
						<div class="detail-meta">
							<span th:text="${job.location != null && !job.location.isBlank() ? job.location : 'Ubicacion no informada'}"></span>
							<span class="posted-time" th:if="${job.postedAtLabel != null && !job.postedAtLabel.isBlank()}" th:attr="data-posted=${job.postedAtLabel}" th:text="${' - ' + job.postedAtLabel}"></span>
						</div>
					</div>
				</div>

				<div class="detail-actions">
					<a class="btn btn-primary" th:href="@{/jobs/{id}/match(id=${job.id})}">Analizar con perfil</a>
					<a class="btn btn-secondary"
					   th:if="${job.sourceUrl != null && !job.sourceUrl.isBlank()}"
					   th:href="${job.sourceUrl}"
					   target="_blank"
					   rel="noopener">Ver oferta</a>
					<a class="btn btn-secondary" th:href="@{/jobs}">Volver a ofertas</a>
				</div>
			</div>

			<div class="detail-body">
				<section class="detail-panel"
						 th:with="bestText=${(job.description != null && !job.description.isBlank()) ? job.description : job.visibleText}">
					<h2>Descripcion</h2>
					<p class="job-description detail-text"
					   th:if="${bestText != null && !bestText.isBlank()}"
					   th:text="${bestText}"></p>
					<p class="muted" th:if="${bestText == null || bestText.isBlank()}">
						Esta oferta todavia no tiene una descripcion disponible.
					</p>
				</section>

				<section class="detail-panel"
						 th:if="${job.requirementsText != null && !job.requirementsText.isBlank()}">
					<h2>Requisitos</h2>
					<p class="job-description detail-text" th:text="${job.requirementsText}"></p>
				</section>
			</div>
		</article>
	</section>
</main>
<script>
  (function () {
    function formatPostedAt(text) {
      const raw = String(text || "").trim();
      if (!raw) return "";
      return raw;
    }

    document.querySelectorAll(".posted-time[data-posted]").forEach((el) => {
      const formatted = formatPostedAt(el.dataset.posted);
      el.textContent = formatted ? ` - ${formatted}` : "";
    });
  })();
</script>
</body>
</html>
