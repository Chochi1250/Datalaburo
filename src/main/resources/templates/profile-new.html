<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<title>DataLaburo - Nuevo perfil</title>
	<link rel="stylesheet" th:href="@{/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container">
	<header class="header">
		<h1>Nuevo perfil</h1>
		<p class="muted">Guarda un nombre y un CV en texto para reutilizarlo en matching.</p>
	</header>

	<section class="card" th:if="${error}">
		<p class="error" th:text="${error}"></p>
	</section>

	<section class="card">
		<form method="post" th:action="@{/profiles}" th:object="${form}">
			<div class="field">
				<label for="name">Nombre del perfil</label>
				<input id="name" type="text" th:field="*{name}" placeholder="Ej: Mi CV backend"/>
			</div>

			<div class="grid-2">
				<div class="field">
					<label for="targetRole">Rol objetivo</label>
					<select id="targetRole" th:field="*{targetRole}">
						<option value="UNDECIDED">Sin definir</option>
						<option value="BACKEND">Backend</option>
						<option value="FRONTEND">Frontend</option>
						<option value="FULL_STACK">Full stack</option>
						<option value="DATA">Data</option>
						<option value="QA">QA</option>
						<option value="DEVOPS">DevOps</option>
						<option value="CLOUD">Cloud</option>
						<option value="IT_SUPPORT">IT support</option>
						<option value="APP_SUPPORT">App support</option>
						<option value="SECURITY_OPS">Security ops</option>
						<option value="IAM">IAM</option>
						<option value="DATABASE">Database</option>
					</select>
				</div>

				<div class="field">
					<label for="targetSeniority">Seniority objetivo</label>
					<select id="targetSeniority" th:field="*{targetSeniority}">
						<option value="ANY">Cualquiera</option>
						<option value="TRAINEE">Trainee</option>
						<option value="JUNIOR">Junior</option>
						<option value="MID">Mid</option>
						<option value="SENIOR">Senior</option>
						<option value="LEAD">Lead</option>
					</select>
				</div>
			</div>

			<div class="field">
				<label for="searchMode">Modo de busqueda</label>
				<select id="searchMode" th:field="*{searchMode}">
					<option value="FOCUSED">Enfocado</option>
					<option value="BALANCED">Balanceado</option>
					<option value="EXPLORATORY">Exploratorio</option>
				</select>
				<p class="hint muted">Estos campos se guardan como contexto del perfil. Todavia no cambian ranking, embeddings ni matching.</p>
			</div>

			<div class="field">
				<label for="cvText">CV (texto)</label>
				<textarea id="cvText" rows="14" th:field="*{cvText}"
						  placeholder="Pega aca el CV en texto plano"></textarea>
				<p class="hint muted">MVP: sin login real y sin PDF todavia.</p>
			</div>

			<div class="actions">
				<button type="submit">Guardar perfil</button>
				<a class="link" th:href="@{/profiles}">Cancelar</a>
			</div>
		</form>
	</section>
</main>
</body>
</html>
