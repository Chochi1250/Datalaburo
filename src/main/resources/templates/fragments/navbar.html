<div th:fragment="navbar">
  <script>
    (function () {
      try {
        const saved = localStorage.getItem("datalaburo.theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.dataset.theme = saved;
        }
      } catch (_) {}
    })();
  </script>

  <nav class="navbar">
    <div class="nav-inner">
      <div class="nav-start">
        <a class="nav-brand" th:href="@{/}" aria-label="DataLaburo - Inicio">
          <span class="nav-logo"><span class="nav-logo-data">Data</span><span class="nav-logo-accent">Laburo</span></span>
        </a>

        <form class="nav-search" th:action="@{/jobs}" method="get" role="search" aria-label="Buscar ofertas">
          <label class="sr-only" for="nav-search-input">Buscar ofertas</label>
          <img class="nav-search-icon" th:src="@{/images/pngtree-magnifying-glass-icon-image_1128382.png}" alt="" aria-hidden="true" />
          <input id="nav-search-input" type="search" name="q" placeholder="Buscar" autocomplete="off" />
          <button class="sr-only" type="submit">Buscar</button>
        </form>
      </div>

      <div class="nav-links">
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/jobs}">Ofertas</a>
        <a th:href="@{/vector-search}">Matching</a>
        <a th:href="@{/profiles}">Perfiles</a>
      </div>

      <div class="nav-actions">
        <button id="theme-toggle" type="button" class="btn btn-ghost btn-sm" aria-pressed="false">Tema: Claro</button>
      </div>
    </div>
  </nav>

  <script>
    (function () {
      const btn = document.getElementById("theme-toggle");
      if (!btn) return;

      function currentTheme() {
        const t = document.documentElement.dataset.theme;
        return t === "dark" || t === "light" ? t : "light";
      }

      function apply(theme) {
        document.documentElement.dataset.theme = theme;
        btn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
        btn.textContent = theme === "dark" ? "Tema: Oscuro" : "Tema: Claro";
        try {
          localStorage.setItem("datalaburo.theme", theme);
        } catch (_) {}
      }

      apply(currentTheme());
      btn.addEventListener("click", () => apply(currentTheme() === "dark" ? "light" : "dark"));
    })();
  </script>
</div>
