spring.application.name=DataLaburo

# If 8080 is busy on your machine, use 8081 for the demo.
server.port=8081

# =========================
# Demo DB (H2 file-based = persists across restarts)
# =========================
# Files are created under ./data (relative to the project root when you run mvnw).
# Keep it file-based for persistence across restarts.
# Note: some H2 versions don't support AUTO_SERVER=TRUE together with DB_CLOSE_ON_EXIT=FALSE.
spring.datasource.url=jdbc:h2:file:./data/datalaburo;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 Console
# http://localhost:8081/h2-console
# JDBC URL in the console: jdbc:h2:file:./data/datalaburo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Spring AI pgvector autoconfiguration requires additional setup; keep disabled for MVP.
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

