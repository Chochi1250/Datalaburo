spring.application.name=DataLaburo

# If 8080 is busy on your machine, use 8081 for the demo.
server.port=8081

# PostgreSQL is the default local profile. H2 is legacy/obsolete for the app flow.
spring.profiles.active=postgres

spring.jpa.open-in-view=false

embedding.bge-m3.base-url=http://127.0.0.1:8001
embedding.bge-m3.timeout-seconds=120

datalaburo.backfill-publication-dates.enabled=false
datalaburo.backfill-job-classifications.enabled=false
